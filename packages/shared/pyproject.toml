[project]
name = "niglas-shared"
version = "0.1.0"
description = "Framework-free Niglas domain logic (ids, clock, money, rbac)"
requires-python = ">=3.11"
dependencies = ["niglas-schemas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niglas_shared"]
