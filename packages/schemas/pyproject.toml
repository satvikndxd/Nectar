[project]
name = "niglas-schemas"
version = "0.1.0"
description = "Versioned cross-layer data contracts for Niglas"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niglas_schemas"]
