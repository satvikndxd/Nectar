[project]
name = "niglas"
version = "0.1.0"
description = "Niglas - autonomous business operations and decision intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "niglas-api",
    "niglas-generator",
    "niglas-schemas",
    "niglas-shared",
]

[dependency-groups]
dev = [
    "anyio>=4.4",
    "httpx>=0.27",
    "import-linter>=2.0",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[tool.uv.workspace]
members = ["packages/*", "apps/api", "data/generators"]

[tool.uv.sources]
niglas-schemas = { workspace = true }
niglas-shared = { workspace = true }
niglas-generator = { workspace = true }
niglas-api = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["packages/schemas/src", "packages/shared/src", "data/generators/src", "apps/api/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "ANN", "S", "DTZ", "PT"]
ignore = ["ANN401"]

[tool.ruff.lint.isort]
known-first-party = ["niglas_api", "niglas_generator", "niglas_schemas", "niglas_shared"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "ANN201", "ANN001", "PT018"]
"apps/api/migrations/**" = ["ANN", "N999", "S"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "packages/schemas/src:packages/shared/src:data/generators/src:apps/api/src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "db: test requires a live PostgreSQL database (NIGLAS_TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:niglas_.*"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
bypass-selection = true
