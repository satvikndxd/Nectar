[project]
name = "niglas-anomaly"
version = "0.1.0"
description = "Deterministic anomaly detection and localisation for Niglas"
requires-python = ">=3.11"
dependencies = ["niglas-schemas", "niglas-shared"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niglas_anomaly"]
