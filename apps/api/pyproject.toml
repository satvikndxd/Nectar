[project]
name = "niglas-api"
version = "0.1.0"
description = "Niglas operator API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "niglas-schemas",
    "niglas-shared",
    "niglas-generator",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.32",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pyjwt>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/niglas_api"]
